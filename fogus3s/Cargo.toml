[package]
name = "fogus3s"
version = "0.1.0"
edition = "2024"

[dependencies]
s3s = "0.17"
s3s-fs = { version = "0.17", default-features = false }
async-trait = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
http = "1"
http-body = "1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
serde_json = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
strip = true
